name: Build and Publish Wheels to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_windows_wheels:
    name: Build Windows Wheels
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Set up Boost Headers
        shell: pwsh
        run: |
          if (Test-Path "$env:BOOST_ROOT_1_83_0") {
            Write-Host "Using pre-installed Boost 1.83.0 from runner"
            echo "BOOST_ROOT=$env:BOOST_ROOT_1_83_0" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\local\boost_1_83_0") {
            echo "BOOST_ROOT=C:\local\boost_1_83_0" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\local\boost_1_82_0") {
            echo "BOOST_ROOT=C:\local\boost_1_82_0" >> $env:GITHUB_ENV
          } else {
            Write-Host "Downloading Boost release archive..."
            Invoke-WebRequest -Uri "https://github.com/boostorg/boost/releases/download/boost-1.82.0/boost-1.82.0-bdist-windows-x86_64.zip" -OutFile "$env:TEMP\boost.zip"
            Expand-Archive "$env:TEMP\boost.zip" -DestinationPath "C:\boost" -Force
            echo "BOOST_ROOT=C:\boost" >> $env:GITHUB_ENV
          }

      - name: Build and repair Windows wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp39-win_amd64 cp310-win_amd64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64 cp314-win_amd64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_ENVIRONMENT_WINDOWS: 'BOOST_ROOT="${{ env.BOOST_ROOT }}" QT_DIR="${{ env.Qt5_Dir }}"'
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: 'delvewheel repair --add-path "${{ env.Qt5_Dir }}/bin" -w {dest_dir} {wheel}'

      - name: Upload Windows wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

  build_linux_wheels:
    name: Build Linux Wheels
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Linux wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "dnf --enablerepo=powertools install -y qt5-qtbase-devel boost-devel || dnf --enablerepo=crb install -y qt5-qtbase-devel boost-devel || dnf install -y qt5-qtbase-devel boost-devel"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_to_pypi:
    name: Publish to PyPI
    needs: [build_windows_wheels, build_linux_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scantailor-advanced
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
