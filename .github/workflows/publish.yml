name: Build and Publish Wheels to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_windows_wheels:
    name: Build Windows Wheel (Python ${{ matrix.python-version }})
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt 5 via aqtinstall
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir C:\Qt

      - name: Cache Boost Headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: C:\boost
          key: boost-1.83.0-headers-v1

      - name: Set up Boost Headers
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\boost"
          Write-Host "Downloading official Boost 1.83.0 release archive..."
          curl.exe -sL "https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz" -o "$env:TEMP\boost.tar.gz"
          tar.exe -xzf "$env:TEMP\boost.tar.gz" --strip-components=1 -C "C:\boost"

      - name: Configure Environment
        shell: pwsh
        run: |
          echo "BOOST_ROOT=C:\boost" >> $env:GITHUB_ENV
          echo "QT_DIR=C:\Qt\5.15.2\msvc2019_64" >> $env:GITHUB_ENV

      - name: Build and Repair Wheel
        shell: pwsh
        run: |
          pip install pybind11 delvewheel setuptools wheel
          $env:BOOST_ROOT = "C:\boost"
          $env:QT_DIR = "C:\Qt\5.15.2\msvc2019_64"
          pip wheel . -w dist --no-deps
          New-Item -ItemType Directory -Force -Path repaired_dist
          Get-ChildItem dist/*.whl | ForEach-Object {
            delvewheel repair --add-path C:/Qt/5.15.2/msvc2019_64/bin -w repaired_dist $_.FullName
          }

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: repaired_dist/*-win_amd64.whl

  build_linux_wheels:
    name: Build Linux Wheels
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Linux wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.23.0
        env:
          CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "dnf --enablerepo=powertools install -y qt5-qtbase-devel boost-devel || dnf --enablerepo=crb install -y qt5-qtbase-devel boost-devel || dnf install -y qt5-qtbase-devel boost-devel"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_to_pypi:
    name: Publish to PyPI
    needs: [build_windows_wheels, build_linux_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scantailor-advanced
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
